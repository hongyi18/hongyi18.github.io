<!doctype html>
<html lang="{{ site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <title>Page moved</title>
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <script>window.location.replace({{ page.redirect_to | relative_url | jsonify }} + window.location.hash);</script>
  </head>
  <body><p>This page has moved. <a href="{{ page.redirect_to | relative_url }}">Continue to the new page</a>.</p></body>
</html>
